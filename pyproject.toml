[project]
name = "inbox-helper"
version = "0.1.0"
description = "Groups candidate messages by intent and drafts replies. Nothing is sent until a reviewer approves it."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.13",
    "azure-identity>=1.25",
    "openai-agents>=0.24,<0.25",
    "pydantic>=2.14,<3",
]

[project.scripts]
inbox-helper = "inbox_helper.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.18",
    "pytest>=8.4",
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inbox_helper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PT", "C4", "N"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]
